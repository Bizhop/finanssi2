services:
  backend:
    build:
      context: .
    image: finanssi2-backend:local
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/finanssi
      DATABASE_USERNAME: finanssi
      DATABASE_PASSWORD: finanssi
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-adminsdk.json
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./finanssi2-firebase-adminsdk.json:/run/secrets/firebase-adminsdk.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: finanssi
      POSTGRES_USER: finanssi
      POSTGRES_PASSWORD: finanssi
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanssi -d finanssi"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
