spring.application.name=finanssi2
# /ws: browsers cannot send an Authorization header on the websocket handshake, so the token is checked on STOMP CONNECT instead
# (StompAuthenticationInterceptor)
finanssi2.endpoints.whitelist=/api/health/live,/ws
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/finanssi}
spring.datasource.username=${DATABASE_USERNAME:finanssi}
spring.datasource.password=${DATABASE_PASSWORD:finanssi}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Jackson 2 is on the classpath too (firebase-admin brings it), so say which one maps the JSONB columns
spring.jpa.properties.hibernate.type.json_format_mapper=org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Exact verified account emails, comma-separated. Empty disables debug mode.
finanssi2.debug.allowed-emails=${FINANSSI_DEBUG_ALLOWED_EMAILS:ville.piispa@gmail.com}
finanssi2.web.allowed-origin=${FINANSSI_ALLOWED_ORIGIN:http://localhost:3000}
finanssi2.firebase.credentials=${GOOGLE_APPLICATION_CREDENTIALS:finanssi2-firebase-adminsdk.json}
