spring.application.name=finanssi2
# /ws: browsers cannot send an Authorization header on the websocket handshake, so the token is checked on STOMP CONNECT instead
# (StompAuthenticationInterceptor)
finanssi2.endpoints.whitelist=/api/hello /ws
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/finanssi}
spring.datasource.username=${DATABASE_USERNAME:finanssi}
spring.datasource.password=${DATABASE_PASSWORD:finanssi}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Exact verified account emails, comma-separated. Empty disables debug mode.
finanssi2.debug.allowed-emails=ville.piispa@gmail.com
