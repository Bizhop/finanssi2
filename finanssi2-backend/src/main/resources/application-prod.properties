# Runtime service writes Spring config-tree files here from Secrets Manager values.
spring.config.import=configtree:/run/finanssi2/config/

# Close idle sessions so Aurora Serverless v2 can reach zero ACUs.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.connection-timeout=90000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.data-source-properties.connectTimeout=60
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslrootcert=/etc/ssl/certs/aws-rds-global-bundle.pem

# Trust forwarded scheme/host headers from the local Caddy proxy.
server.forward-headers-strategy=framework
