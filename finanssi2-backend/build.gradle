plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'net.ltgt.errorprone' version '5.1.1'
}

group = 'fi.bizhop'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	// Only Firebase Auth is used; firebase-admin drags in Firestore, Cloud Storage and the gRPC stack for the other products
	implementation('com.google.firebase:firebase-admin:9.11.0') {
		exclude group: 'com.google.cloud', module: 'google-cloud-firestore'
		exclude group: 'com.google.cloud', module: 'google-cloud-storage'
	}
	// firebase-admin uses this JSON factory but only declares it through the modules excluded above; matches google-http-client
	runtimeOnly 'com.google.http-client:google-http-client-jackson2:2.2.0'
	// Page, in the signatures of FirebaseAuth's list methods; the same version the excluded modules pulled in
	runtimeOnly 'com.google.api:gax:2.85.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	errorprone 'com.google.errorprone:error_prone_core:2.50.0'
	errorprone 'com.uber.nullaway:nullaway:0.14.2'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-resttestclient'
	testImplementation 'org.springframework.boot:spring-boot-restclient'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xlint:deprecation', '-Xlint:removal']
	options.errorprone {
		disableAllChecks = true
		check('NullAway', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
		option('NullAway:OnlyNullMarked', 'true')
		option('NullAway:JSpecifyMode', 'true')
	}
}

// Null checks guard the production code; tests pass null on purpose
tasks.named('compileTestJava') {
	options.errorprone.enabled = false
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'container', 'database'
	}
}

// Tests that need Docker (Testcontainers); run manually with ./gradlew containerTest
tasks.register('containerTest', Test) {
	description = 'Runs the tests that start Docker containers.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'container'
	}
}

def databaseTestName = 'finanssi_test'
def databaseTestUrl = {
	def baseUrl = providers.environmentVariable('DATABASE_URL')
		.getOrElse('jdbc:postgresql://host.docker.internal:5432/finanssi')
	def queryIndex = baseUrl.indexOf('?')
	def pathEnd = queryIndex < 0 ? baseUrl.length() : queryIndex
	def databaseSeparator = baseUrl.lastIndexOf('/', pathEnd)
	if (!baseUrl.startsWith('jdbc:postgresql://') || databaseSeparator <= 'jdbc:postgresql://'.length()
			|| databaseSeparator == pathEnd) {
		throw new GradleException('DATABASE_URL must be a PostgreSQL JDBC URL with a database name')
	}
	def prefix = baseUrl.substring(0, databaseSeparator + 1)
	def suffix = queryIndex < 0 ? '' : baseUrl.substring(queryIndex)
	[admin: "${prefix}postgres${suffix}", test: "${prefix}${databaseTestName}${suffix}"]
}
def withPostgresAdmin = { action ->
	def urls = databaseTestUrl()
	def jdbcUrls = configurations.testRuntimeClasspath.files.collect { it.toURI().toURL() } as URL[]
	def driverLoader = new URLClassLoader(jdbcUrls, this.class.classLoader)
	try {
		def driver = Class.forName('org.postgresql.Driver', true, driverLoader).getDeclaredConstructor().newInstance()
		def properties = new Properties()
		properties.setProperty('user', providers.environmentVariable('DATABASE_USERNAME').getOrElse('finanssi'))
		properties.setProperty('password', providers.environmentVariable('DATABASE_PASSWORD').getOrElse('finanssi'))
		action(driver.connect(urls.admin, properties))
	} finally {
		driverLoader.close()
	}
}

def prepareDatabaseTest = tasks.register('prepareDatabaseTest') {
	description = 'Recreates the disposable PostgreSQL database used by databaseTest.'
	group = 'verification'
	doLast {
		withPostgresAdmin { connection ->
			try {
				connection.createStatement().withCloseable { statement ->
					statement.execute("DROP DATABASE IF EXISTS ${databaseTestName} WITH (FORCE)")
					statement.execute("CREATE DATABASE ${databaseTestName}")
				}
			} finally {
				connection.close()
			}
		}
	}
}

def databaseTestTask = tasks.register('databaseTest', Test) {
	description = 'Runs PostgreSQL persistence tests against a disposable database.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	dependsOn(prepareDatabaseTest)
	environment 'FINANSSI_DATABASE_TEST_URL', databaseTestUrl().test
	environment 'DATABASE_USERNAME', providers.environmentVariable('DATABASE_USERNAME').getOrElse('finanssi')
	environment 'DATABASE_PASSWORD', providers.environmentVariable('DATABASE_PASSWORD').getOrElse('finanssi')
	useJUnitPlatform {
		includeTags 'database'
	}
}

def cleanupDatabaseTest = tasks.register('cleanupDatabaseTest') {
	description = 'Drops the databaseTest database after a successful run.'
	group = 'verification'
	// Keep the database intact after failures so its schema and data can be inspected.
	onlyIf { databaseTestTask.get().state.failure == null && databaseTestTask.get().state.didWork }
	doLast {
		withPostgresAdmin { connection ->
			try {
				connection.createStatement().withCloseable { statement ->
					statement.execute("DROP DATABASE IF EXISTS ${databaseTestName} WITH (FORCE)")
				}
			} finally {
				connection.close()
			}
		}
	}
}
databaseTestTask.configure {
	finalizedBy(cleanupDatabaseTest)
}
